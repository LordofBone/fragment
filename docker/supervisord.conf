[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24 -ac -nolisten tcp
priority=10
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:openbox]
command=/usr/bin/openbox-session
directory=/opt/fragment
environment=DISPLAY=:1
priority=20
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --system=false --exit-idle-time=-1
priority=25
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
priority=30
autostart=true
autorestart=true
stopsignal=INT
environment=DISPLAY=:1
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080
priority=40
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
