[supervisord]
nodaemon=true
logfile=/var/log/fragment/supervisord.log
childlogdir=/var/log/fragment
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:pulseaudio]
command=/workspace/fragment/docker/start-fragment.sh pulseaudio
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/var/log/fragment/pulseaudio.out.log
stderr_logfile=/var/log/fragment/pulseaudio.err.log

[program:xorg]
command=/workspace/fragment/docker/start-fragment.sh xorg
autostart=true
autorestart=true
startretries=10
startsecs=2
priority=10
stdout_logfile=/var/log/fragment/xorg.out.log
stderr_logfile=/var/log/fragment/xorg.err.log

[program:window_manager]
command=/workspace/fragment/docker/start-fragment.sh wm
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/var/log/fragment/wm.out.log
stderr_logfile=/var/log/fragment/wm.err.log

[program:vnc]
command=/workspace/fragment/docker/start-fragment.sh vnc
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/var/log/fragment/vnc.out.log
stderr_logfile=/var/log/fragment/vnc.err.log

[program:fragment]
command=/workspace/fragment/docker/start-fragment.sh fragment
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/var/log/fragment/fragment.out.log
stderr_logfile=/var/log/fragment/fragment.err.log

logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24 -ac -nolisten tcp
priority=10
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:openbox]
command=/usr/bin/openbox-session
directory=/opt/fragment
environment=DISPLAY=:1
priority=20
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --system=false --exit-idle-time=-1
priority=25
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
priority=30
autostart=true
autorestart=true
stopsignal=INT
environment=DISPLAY=:1
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080
priority=40
autostart=true
autorestart=true
stopsignal=INT
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
